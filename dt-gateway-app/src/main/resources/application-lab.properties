spring.application.name=dt-gateway-app

# ─── LAB PROFILE — activated with -Dspring-boot.run.profiles=lab ──────────
# Overrides application.properties when the "lab" profile is active.

# Point at the lab mappings folder — keep mock mappings out of the way.
dt.framework.config-path=classpath:configs-lab

# Adapter poll rate. Slightly slower in the lab to be gentle on the network.
dt.framework.poll-interval-ms=1000

# ⚠️ SAFETY — READ-ONLY MODE. Every PATCH returns 403. The Swing UI (if the
# Swing plugin is present) greys out its write panel. Do not change this until you have verified
# all mappings against the real machine.
dt.framework.safe-mode=true

# Record every value change to a file for later analysis (thesis material).
dt.framework.data-log.enabled=true
dt.framework.data-log.path=logs/lab-session.jsonl

# ─── Swing UI ─────────────────────────────────────────────────────────────
# Only takes effect when the Swing plugin (gateway-plugins/swing-plugin) is on the classpath.
dt.ui.enabled=true
dt.ui.title=DT Gateway Dashboard (LAB)
dt.ui.status-refresh-ms=1000

# ─── Protocol adapters ────────────────────────────────────────────────────
# Just the on/off switches. The endpoint, credentials, and security policy
# live in configs-lab/osaca-lab.json (the machine's own file).
# internal
# dt.adapter.enabled=false
# No MQTT machines at the lab — keep the plugin off under this profile.
dt.adapter.mqtt.enabled=true

# ─── Logging — more verbose, separate file per session ────────────────────
logging.file.name=logs/lab-session.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.com=DEBUG
