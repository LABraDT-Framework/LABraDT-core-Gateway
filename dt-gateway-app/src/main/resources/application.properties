spring.application.name=dt-gateway-app

# ─── Server ───────────────────────────────────────────────────────────────
# REST + SSE port. The engine runs on 8080 and the service manager on 8082;
# the engine's gateway.url expects the gateway on 8085.
# Override with the SERVER_PORT env var or --server.port=<n>
# (under Maven: -Dspring-boot.run.arguments=--server.port=<n>).
server.port=8085

# ─── Framework configuration ──────────────────────────────────────────────
# Where to find machine config files. Supports classpath: and filesystem paths.
# The core ships no machine files (configs/ is empty); the protocol plugins bring
# their demo configs.
dt.framework.config-path=classpath:configs

# How often the updater polls adapters and refreshes the SubmodelStore (ms).
dt.framework.poll-interval-ms=2000

# SSE stream: besides change-only "update" events, periodically re-broadcast the
# full state (with staleness applied) as "keyframe" events. Lets stream consumers
# detect machines going STALE and recover missed events. 0-effect: set enabled=false.
dt.framework.stream.keyframe-enabled=true
dt.framework.stream.keyframe-interval-ms=10000

# Lab-safety switch — when true, all PATCH writes return 403.
# Default this to TRUE on the first lab session against a real machine.
dt.framework.safe-mode=false

# Domain-data recorder. Appends every value change as JSON-Lines.
dt.framework.data-log.enabled=true
dt.framework.data-log.path=logs/data.jsonl

# Deadband filtering — notify listeners (data recorder, UI) only when the
# stored value or status actually changes. Stops the recorder from filling
# the disk and the UI from repainting when polling a stable value.
dt.framework.deadband.enabled=true

# ─── Swing UI plugin (in-process dashboard) ───────────────────────────────
# Activate the desktop window. Requires a display — disable on headless servers.
# Only takes effect when the Swing plugin (internal project gateway-plugins/swing-plugin)
# is on the classpath.
dt.ui.enabled=true
dt.ui.title=DT Gateway Dashboard
dt.ui.status-refresh-ms=1000

# ─── Protocol adapters ────────────────────────────────────────────────────
# Just the on/off switches. Each machine — its endpoint, credentials, and
# mappings — is defined entirely in its own file under configs/.
# dt.adapter.enabled=false
dt.adapter.mqtt.enabled=true

# ─── App logging to file ──────────────────────────────────────────────────
logging.file.name=logs/dt-gateway.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.com=INFO
